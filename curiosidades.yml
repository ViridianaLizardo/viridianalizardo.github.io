# Una entrada por curiosidad. Aparecen en este orden.
# Campos:
#   title        nombre
#   path         enlace (su repo con GitHub Pages, o experimentos/nombre/ para los de un solo archivo)
#   description  una línea
#   glifo        símbolo grande si no hay imagen (¶ ✎ ◉ ✦ ► ☾ ♪ …)
#   image        opcional: captura o GIF en imagenes/ (reemplaza al glifo)
#   fondo        pop | soft | dot | acc
#   etiqueta     escritura | juego | ciencia | experimento …

- title: GIS-stitch
  path: https://viridianalizardo.github.io/GIS-stitch/
  description: Escribe tu año de nacimiento y borda cuánto cambió el clima de México desde entonces.
  image: imagenes/gis-stitch.png
  fondo: dot
  etiqueta: ciencia

- title: Cuento.exe
  path: https://viridianalizardo.github.io/ideas_escritura/
  description: Máquina de ideación narrativa para salir del bloqueo creativo.
  glifo: "¶"
  fondo: pop
  etiqueta: escritura

- title: Conejo-encuesta
  path: https://viridianalizardo.github.io/conejo-encuesta/
  description: Responde 10 preguntas y descubre qué conejo eres.
  image: imagenes/conejo.png
  fondo: soft
  etiqueta: juego

